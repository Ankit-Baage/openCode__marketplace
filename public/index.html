    font-src 'self' https://fonts.gstatic.com;

      https://mg-spares-assets.s3.ap-south-1.amazonaws.com
      https://aws-mg-new-bucket.s3.ap-south-1.amazonaws.com
      https://aws-spares.s3.ap-south-1.amazonaws.com
      https://aws-mg-assets.s3.ap-south-1.amazonaws.com;
    connect-src 'self' blob: https://backend.mobigarage.com https://dev.backend.mobigarage.com https://api.razorpay.com;

    <!-- 📊 Structured Data (Organization) -->
    <script type="application/ld+json">
